# Every push to main (direct commits and merged pull requests) that changes the app publishes a new release,
# which the app's updater then offers to users. Documentation-only pushes ship with the next release (the zip
# would be identical). The version bumps the patch number; write [minor] or [major] in a commit message to
# bump those instead, or [skip release] to publish nothing.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    env:
      # Optional stable signing certificate (base64 .p12 and its password), see scripts/make-signing-cert.sh.
      HAS_SIGNING_CERT: ${{ secrets.MENUSTATS_SIGNING_P12 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Next version
        id: version
        run: |
          VERSION=$(./scripts/next-version.sh notes.md)
          if [ "$VERSION" = skip ]; then echo "Nothing to release"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          cat notes.md

      - name: Test
        if: steps.version.outputs.skip != 'true'
        run: ./scripts/test.sh

      - name: Signing certificate
        if: steps.version.outputs.skip != 'true' && env.HAS_SIGNING_CERT == 'true'
        env:
          P12: ${{ secrets.MENUSTATS_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.MENUSTATS_SIGNING_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign >/dev/null
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN" >/dev/null
          rm "$RUNNER_TEMP/signing.p12"
          # codesign looks for identities in the user's keychain list, and on recent macOS wants a self-signed
          # certificate trusted for code signing.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-certificate -c "MenuStats Self Signing" -p "$KEYCHAIN" > "$RUNNER_TEMP/signing.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/signing.pem"
          security find-identity -p codesigning "$KEYCHAIN"
          HASH=$(security find-certificate -c "MenuStats Self Signing" -Z "$KEYCHAIN" | awk '/SHA-1/{print $3}')
          # A failed test signature must not block the release: it then ships ad hoc, as before.
          cp /usr/bin/true "$RUNNER_TEMP/probe"
          if codesign --force --keychain "$KEYCHAIN" --sign "$HASH" "$RUNNER_TEMP/probe"; then
            echo "APP_SIGN_IDENTITY=$HASH" >> "$GITHUB_ENV"
            echo "APP_SIGN_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          else
            echo "::warning::Firma con il certificato non riuscita: la release è firmata ad hoc"
          fi

      - name: Build
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          xcodebuild -version
          ./scripts/build-app.sh
          codesign --verify --deep --strict build/MenuStats.app
          codesign -dr - build/MenuStats.app
          ditto -c -k --sequesterRsrc --keepParent build/MenuStats.app "MenuStats-$VERSION.zip"

      - name: Publish
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          printf '\nSHA-256 di `MenuStats-%s.zip`: `%s`\n' "$VERSION" "$(shasum -a 256 "MenuStats-$VERSION.zip" | cut -d' ' -f1)" >> notes.md
          # GitHub appends the merged pull requests with their authors.
          gh release create "v$VERSION" "MenuStats-$VERSION.zip" \
            --target "$GITHUB_SHA" --title "MenuStats $VERSION" --notes-file notes.md --generate-notes
